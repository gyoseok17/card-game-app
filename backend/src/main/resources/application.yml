spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/onecard?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:onecard-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000

server:
  port: 8080
  address: 0.0.0.0

logging:
  level:
    com.onecard: DEBUG
