version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: onecard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: onecard
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: eclipse-temurin:21-jdk
    container_name: onecard-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: sh -c "./gradlew bootRun"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/onecard?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 1234
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: onecard-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  mysql_data:
