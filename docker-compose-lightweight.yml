services:
  redis:
    image: redis:7-alpine
    container_name: onecard-redis
    command: --maxmemory 50mb --maxmemory-policy allkeys-lru

  mysql:
    image: mysql:8.0
    container_name: onecard-mysql
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: onecard
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: gyoseok/onecard-backend
    container_name: onecard-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/onecard?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: gyoseok/onecard-frontend
    container_name: onecard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: